version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: cilenco-lldap_server_1
      APP_PORT: 17170
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/lldap/lldap:latest@sha256:78ff572676cd6c69fca3ff37c5537d286ae93f10845aa9541553e93f90047baa
    restart: on-failure
    environment:
      LLDAP_LDAP_USER_DN: umbrel
      LLDAP_LDAP_USER_PASS: ${APP_PASSWORD}
      LLDAP_LDAP_BASE_DN: dc=homelab,dc=com
      LLDAP_JWT_SECRET: ${LDAP_JWT_SECRET}
      LLDAP_KEY_SEED: ${LDAP_KEY_SEED}
    volumes:
      - ${APP_DATA_DIR}/ldap:/data
